<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dropzyy</title>
    
    <!-- Critical App Launch Preloader Styling (Renders Instantly on Launch) -->
    <style>
        #appLaunchLoaderOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999999;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
            will-change: opacity, visibility;
            user-select: none;
            -webkit-user-select: none;
        }
        #appLaunchLoaderOverlay.loader-fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        .app-loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
            max-width: 320px;
        }
        .app-loader-logo-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }
        .app-loader-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: dropzyyLogoPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(16, 185, 129, 0.15));
        }
        .app-loader-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2.5px dashed rgba(16, 185, 129, 0.35);
            animation: dropzyyRingSpin 8s linear infinite;
        }
        .app-loader-title {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .app-loader-tagline {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: #64748B;
            margin-bottom: 22px;
        }
        .app-loader-track {
            width: 160px;
            height: 4px;
            background: #F1F5F9;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 14px;
        }
        .app-loader-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, #10B981 0%, #059669 50%, #F59E0B 100%);
            border-radius: 999px;
            animation: dropzyyLoadingBar 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .app-loader-status {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: #059669;
            letter-spacing: 0.2px;
        }
        @keyframes dropzyyLogoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        @keyframes dropzyyRingSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes dropzyyLoadingBar {
            0% { left: -45%; }
            100% { left: 100%; }
        }
    </style>
    <script>
        window.dismissAppLaunchLoader = function() {
            var overlay = document.getElementById('appLaunchLoaderOverlay');
            if (overlay && !overlay.classList.contains('loader-fade-out')) {
                var status = document.getElementById('appLoaderStatus');
                if (status) status.textContent = 'Ready!';
                setTimeout(function() {
                    overlay.classList.add('loader-fade-out');
                    setTimeout(function() {
                        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    }, 450);
                }, 150);
            }
        };
        // Safe guard fallback: automatically dismiss after 3.2 seconds max
        setTimeout(function() {
            if (typeof window.dismissAppLaunchLoader === 'function') {
                window.dismissAppLaunchLoader();
            }
        }, 3200);
    </script>

</head>
<body style="margin:0; padding:0; background:#FFFFFF;">
    
    <!-- Dropzyy Instant Launch Preloader -->
    <div id="appLaunchLoaderOverlay" aria-label="Dropzyy Loading">
        <div class="app-loader-box">
            <div class="app-loader-logo-wrap">
                <div class="app-loader-ring"></div>
                <img src="dropzyy-logo.png" alt="Dropzyy">
            </div>
            <div class="app-loader-title">Dropzyy</div>
            <div class="app-loader-tagline">⚡ Delivering fresh food & essentials</div>
            <div class="app-loader-track">
                <div class="app-loader-bar"></div>
            </div>
            <div class="app-loader-status" id="appLoaderStatus">Connecting to store...</div>
        </div>
    </div>

    <script>
        // Smoothly redirect to live production site
        window.location.replace("https://www.dropzyy.in");
    </script>
</body>
</html>
