<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropzyy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #334155;
        }
        .logo-box {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            animation: pulse 1.8s infinite ease-in-out;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3.5px solid #E2E8F0;
            border-top-color: #10B981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        .text {
            font-size: 1rem;
            font-weight: 600;
            color: #475569;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.96); opacity: 0.9; }
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <img src="dropzyy-logo.png" alt="Dropzyy">
    </div>
    <div class="spinner"></div>
    <div class="text">Connecting to Dropzyy...</div>

    <script>
        // Redirect to live store if not redirected by Capacitor server.url
        window.location.replace("https://www.dropzyy.in");
    </script>
</body>
</html>
